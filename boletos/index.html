<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abrir boletos en OWG…</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Mis boletos — OWG">
  <meta property="og:description" content="Tus boletos con QR en la app oficial de lucha libre.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #1c1315 0%, #0f0f12 55%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #131316;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 2px; font-weight: 700; }
    .sub { margin: 0 0 12px; color: #ffffff66; font-size: 13px; }
    #status { margin: 0; color: #ffffffb3; line-height: 1.5; font-size: 15px; }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 24px;
      background: #e50914;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
      font-size: 15px;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #ffffff33;
    }
    .actions {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .hint {
      margin: 16px 0 0;
      color: #ffffff55;
      font-size: 12px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>OWG</h1>
    <p class="sub">Official Wrestling Group</p>
    <p id="status">Abriendo tus boletos…</p>
    <div class="actions" id="actions" style="display:none">
      <a id="open-app" class="btn" href="#">📲 Abrir en OWG</a>
      <a id="get-app" class="btn btn-secondary" href="#">Descargar la app</a>
    </div>
    <p class="hint" id="hint">
      También puedes mostrar el código QR del correo en la entrada del evento.
    </p>
  </div>
  <script src="/owg-app-config.js"></script>
  <script>
    (function () {
      var cfg = window.OWG_APP_CONFIG || {};
      var params = new URLSearchParams(window.location.search);
      var order = params.get('order') || '';
      var deepLink = 'owg://boletos' + (order ? '?order=' + encodeURIComponent(order) : '');
      var playStore = cfg.playStoreUrl || 'https://play.google.com/store/apps/details?id=com.owg.app';
      var appStore = typeof cfg.appStoreUrl === 'function' ? cfg.appStoreUrl() : cfg.appStoreUrl;

      var status = document.getElementById('status');
      var actions = document.getElementById('actions');
      var openApp = document.getElementById('open-app');
      var getApp = document.getElementById('get-app');

      openApp.href = deepLink;
      getApp.href = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? appStore : playStore;

      function showActions() {
        status.textContent = 'Toca el botón para ver tus boletos con QR en la app.';
        actions.style.display = 'flex';
      }

      window.location.replace(deepLink);
      setTimeout(showActions, 1200);
      setTimeout(showActions, 2800);
    })();
  </script>
</body>
</html>
