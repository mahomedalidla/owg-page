<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abrir evento en OWG…</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Evento en OWG">
  <meta property="og:description" content="Carteleras y lucha libre — Official Wrestling Group">
  <link rel="stylesheet" href="/shared/owg-tokens.css">
  <link rel="stylesheet" href="/shared/owg-ui.css">
  <style>
    body.owg-body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .owg-card {
      max-width: 420px;
      width: 100%;
      margin-bottom: 0;
      text-align: center;
      padding: 28px 24px;
    }
    .owg-card h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 2px;
      font-weight: 700;
    }
    .sub {
      margin: 0 0 12px;
      color: var(--owg-text-tertiary);
      font-size: 13px;
    }
    #status {
      margin: 0;
      color: var(--owg-text-secondary);
      line-height: 1.5;
      font-size: 15px;
    }
    .actions {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
    }
  </style>
</head>
<body class="owg-body">
  <div class="owg-card">
    <h1>OWG</h1>
    <p class="sub">Official Wrestling Group</p>
    <p id="status">Abriendo cartelera del evento…</p>
    <div class="actions" id="actions" style="display:none">
      <a id="open-app" class="owg-btn" href="#">Abrir en OWG</a>
      <a id="get-app" class="owg-btn owg-btn--secondary" href="#">Descargar la app</a>
    </div>
    <p class="owg-hint" id="hint">
      Si ya tienes OWG, el evento se abrirá en la app. Si no, te llevamos a la tienda.
    </p>
  </div>
  <script src="/owg-app-config.js"></script>
  <script>
    (function () {
      var cfg = window.OWG_APP_CONFIG || {};
      var params = new URLSearchParams(window.location.search);
      var fromQuery = params.get('id');
      var fromPath = window.location.pathname.match(/\/evento\/(\d+)/);
      var eventId = fromQuery || (fromPath ? fromPath[1] : null);

      var playStore = cfg.playStoreUrl || 'https://play.google.com/store/apps/details?id=com.owg.app';
      var appStore = typeof cfg.appStoreUrl === 'function' ? cfg.appStoreUrl() : cfg.appStoreSearchUrl;
      var isAndroid = /Android/i.test(navigator.userAgent);
      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      var storeUrl = isIOS ? appStore : playStore;

      var statusEl = document.getElementById('status');
      var actionsEl = document.getElementById('actions');
      var openBtn = document.getElementById('open-app');
      var getBtn = document.getElementById('get-app');

      getBtn.href = storeUrl;

      if (!eventId || !/^\d+$/.test(String(eventId))) {
        statusEl.textContent =
          'Enlace de evento no válido. Comparte de nuevo desde la cartelera OWG.';
        getBtn.textContent = 'Descargar OWG';
        actionsEl.style.display = 'flex';
        openBtn.style.display = 'none';
        return;
      }

      if (params.get('comprar') === '1' || params.has('comprar')) {
        window.location.replace('/comprar/index.html?id=' + eventId);
        return;
      }

      var deepLink = 'owg://evento/' + eventId;
      var intentLink =
        'intent://evento/' + eventId +
        '#Intent;scheme=owg;package=com.owg.app;S.browser_fallback_url=' +
        encodeURIComponent(storeUrl) + ';end';

      openBtn.href = isAndroid ? intentLink : deepLink;

      openBtn.addEventListener('click', function (e) {
        if (!isAndroid) return;
        e.preventDefault();
        window.location.href = intentLink;
      });

      function mostrarOpciones() {
        statusEl.textContent =
          '¿Tienes OWG? Abre el evento. Si no, descarga la app gratis.';
        actionsEl.style.display = 'flex';
      }

      var appPareceAbierta = false;
      var redirigirTiendaProgramado = false;

      function cancelarRedireccionTienda() {
        redirigirTiendaProgramado = false;
      }

      function programarRedireccionTienda(ms) {
        redirigirTiendaProgramado = true;
        setTimeout(function () {
          if (!redirigirTiendaProgramado || appPareceAbierta) return;
          window.location.href = storeUrl;
        }, ms);
      }

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') {
          appPareceAbierta = true;
          cancelarRedireccionTienda();
        }
      });

      window.addEventListener('pagehide', function () {
        appPareceAbierta = true;
        cancelarRedireccionTienda();
      });

      if (isAndroid) {
        window.location.href = intentLink;
        setTimeout(mostrarOpciones, 2200);
      } else if (isIOS) {
        window.location.href = deepLink;
        programarRedireccionTienda(3200);
        setTimeout(function () {
          if (!appPareceAbierta) mostrarOpciones();
        }, 2800);
      } else {
        statusEl.textContent =
          'Abre este enlace en tu celular para ver la cartelera en OWG.';
        actionsEl.style.display = 'flex';
        openBtn.textContent = 'Ir a owg-app.com';
        openBtn.href = 'https://owg-app.com';
      }
    })();
  </script>
</body>
</html>
