<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abrir evento en OWG…</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Evento en OWG">
  <meta property="og:description" content="Carteleras y lucha libre — Official Wrestling Group">
  <link rel="stylesheet" href="/shared/owg-tokens.css">
  <link rel="stylesheet" href="/shared/owg-ui.css">
  <style>
    body.owg-body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .owg-card {
      max-width: 420px;
      width: 100%;
      margin-bottom: 0;
      text-align: center;
      padding: 28px 24px;
    }
    .owg-brand-logo {
      display: block;
      width: min(160px, 48vw);
      height: auto;
      margin: 0 auto 12px;
    }
    .sub {
      margin: 0 0 12px;
      color: var(--owg-text-tertiary);
      font-size: 13px;
    }
    #status {
      margin: 0;
      color: var(--owg-text-secondary);
      line-height: 1.5;
      font-size: 15px;
    }
    .actions {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
    }
  </style>
</head>
<body class="owg-body">
  <div class="owg-card">
    <img class="owg-brand-logo" src="/shared/logo-letras.svg" alt="OWG" width="160" height="74">
    <p class="sub">Official Wrestling Group</p>
    <p id="status">Elige cómo continuar</p>
    <div class="actions" id="actions">
      <a id="open-app" class="owg-btn" href="#">Abrir en OWG</a>
      <a id="get-app" class="owg-btn owg-btn--secondary" href="https://play.google.com/store/apps/details?id=com.owg.app&pcampaignid=web_share">Descargar la app</a>
    </div>
    <p class="owg-hint" id="hint">
      Si ya tienes OWG, ábrela. Si no, descárgala gratis en la tienda.
    </p>
  </div>
  <!-- Config opcional; owg-store.js trae fallbacks si falta el archivo (404). -->
  <script src="/owg-app-config.js"></script>
  <script src="/shared/owg-store.js"></script>
  <script>
    (function () {
      var Store = window.OwgStore || null;
      var params = new URLSearchParams(window.location.search);
      var fromQuery = params.get('id');
      var fromPath = window.location.pathname.match(/\/evento\/(\d+)/);
      var eventId = fromQuery || (fromPath ? fromPath[1] : null);

      var isAndroid = Store ? Store.isAndroid() : /Android/i.test(navigator.userAgent);
      var isIOS = Store ? Store.isIOS() : /iPhone|iPad|iPod/i.test(navigator.userAgent);
      var playStore = Store
        ? Store.playStoreUrl()
        : 'https://play.google.com/store/apps/details?id=com.owg.app&pcampaignid=web_share';
      var appStore = Store
        ? Store.appStoreUrl()
        : 'https://apps.apple.com/us/app/owg-wrestling-y-lucha-libre/id6780648941';
      var storeUrl = isIOS ? appStore : playStore;

      var statusEl = document.getElementById('status');
      var actionsEl = document.getElementById('actions');
      var openBtn = document.getElementById('open-app');
      var getBtn = document.getElementById('get-app');

      if (Store) {
        Store.bindStoreLink(getBtn, storeUrl);
      } else {
        getBtn.href = storeUrl;
        getBtn.target = '_blank';
        getBtn.rel = 'noopener noreferrer';
      }

      if (!eventId || !/^\d+$/.test(String(eventId))) {
        statusEl.textContent =
          'Enlace de evento no válido. Comparte de nuevo desde la cartelera OWG.';
        getBtn.textContent = 'Descargar OWG';
        openBtn.style.display = 'none';
        actionsEl.style.display = 'flex';
        return;
      }

      if (params.get('comprar') === '1' || params.has('comprar')) {
        window.location.replace('/comprar/index.html?id=' + eventId);
        return;
      }

      var deepLink = 'owg://evento/' + eventId;
      var intentLink =
        'intent://evento/' + eventId +
        '#Intent;scheme=owg;package=com.owg.app;S.browser_fallback_url=' +
        encodeURIComponent(storeUrl) + ';end';

      openBtn.href = isAndroid ? intentLink : deepLink;
      openBtn.addEventListener('click', function (e) {
        if (!isAndroid) return;
        e.preventDefault();
        window.location.href = intentLink;
      });

      // Mostrar chooser de inmediato (Abrir / Descargar). No depender de Universal Links.
      statusEl.textContent =
        '¿Tienes OWG? Ábrela. Si no, descárgala gratis.';
      actionsEl.style.display = 'flex';

      if (!isAndroid && !isIOS) {
        statusEl.textContent =
          'Abre este enlace en tu celular para ver la cartelera en OWG.';
        openBtn.textContent = 'Ir a owg-app.com';
        openBtn.href = 'https://owg-app.com';
        return;
      }

      // Intento suave de abrir la app; si no está, el usuario usa «Descargar».
      // No redirigimos solos a la tienda (antes fallaba si faltaba la config).
      setTimeout(function () {
        try {
          window.location.href = isAndroid ? intentLink : deepLink;
        } catch (_) {}
      }, 500);
    })();
  </script>
</body>
</html>
